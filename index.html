<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ev Hesabı</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1ea; --card:#ffffff; --ink:#1f1c18; --muted:#6f685e; --line:#e8e1d5;
  --accent:#d9572b; --accent-ink:#fff; --accent-soft:#fbe9e1;
  --ok:#23867a; --ok-soft:#dff1ee; --bad:#c2412d; --bad-soft:#fae3de;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(60,40,20,.06);
  --radius:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#151412; --card:#1f1d1a; --ink:#f2ede5; --muted:#a59e93; --line:#332f29;
    --accent:#ee7447; --accent-soft:#3a251c; --ok:#4cc1b1; --ok-soft:#173330;
    --bad:#ef7a66; --bad-soft:#3a1f1a; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}

/* header */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.icon-btn{border:1px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:12px;cursor:pointer;display:grid;place-items:center;font-size:18px}
.sync{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.sync.busy{background:#e0a100;animation:pulse 1s infinite}
.sync.err{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}

/* tabs */
nav.tabs{display:flex;gap:6px;margin:16px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
nav.tabs button{flex:1;border:0;background:none;padding:10px 6px;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
nav.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;line-height:16px}
nav.tabs button.on .badge{background:#fff;color:var(--accent)}

.banner{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--accent-soft);font-size:14px}
.banner button{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;text-decoration:underline}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:17px;font-weight:600}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:15px}

/* summary */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat span{display:block;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat.hl{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat.hl span{color:color-mix(in srgb,var(--bg) 70%,transparent)}

/* form */
.form{display:grid;grid-template-columns:1fr 130px;gap:10px}
.form .full{grid-column:1/-1}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
input[type=text],input[type=password],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.payers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.payers button{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600}
.payers button.on{border-color:var(--accent);background:var(--accent-soft)}
.actions{display:flex;gap:8px;margin-top:2px}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.grow{flex:1}

/* avatar */
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.av.lg{width:40px;height:40px;font-size:17px}

/* lists */
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
ul.list li:first-child{border-top:0}
.li-main{flex:1;min-width:0}
.li-main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-main small{color:var(--muted);font-size:13px}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini{border:0;background:none;cursor:pointer;font-size:16px;padding:6px;border-radius:8px;color:var(--muted)}
.mini:hover{background:var(--bg)}

/* people */
.people{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.person{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;background:var(--bg)}
.person .nm{font-weight:600}
.person small{display:block;color:var(--muted);font-size:13px}
.pill{display:inline-block;margin-top:4px;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.pill.pos{background:var(--ok-soft);color:var(--ok)}
.pill.neg{background:var(--bad-soft);color:var(--bad)}
.pill.zero{background:var(--line);color:var(--muted)}

.tr{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--bg);flex-wrap:wrap}
.tr.me{border-color:var(--accent);background:var(--accent-soft)}
.tr .who{display:flex;align-items:center;gap:6px;font-weight:600;flex:1;min-width:190px}
.tr .arrow{color:var(--muted)}
.tr .amt{font-size:18px}
.done{text-align:center;padding:18px;font-size:18px;font-weight:600;color:var(--ok)}

/* rules */
ol.rules{margin:0;padding:0;list-style:none;counter-reset:r}
ol.rules li{counter-increment:r;display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
ol.rules li:first-child{border-top:0}
ol.rules li::before{content:counter(r);flex:none;width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:14px}
ol.rules .txt{flex:1;padding-top:3px;white-space:pre-wrap;word-break:break-word}
.row{display:flex;gap:8px}

/* dialog */
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100vw - 32px));background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:18px}
.dlg h2{margin:0 0 14px;font-size:19px}
.dlg h3{margin:18px 0 8px;font-size:15px}
.dlg .hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.dlg .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg a{color:var(--accent)}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--bad);color:#fff}

[hidden]{display:none!important}
@media (max-width:480px){
  .form{grid-template-columns:1fr 110px}
  .people{grid-template-columns:1fr 1fr}
  .stat b{font-size:21px}
  .brand h1{font-size:18px}
  .dlg .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">
      <h1>🏠 <span data-i18n="appTitle">Ev Hesabı</span></h1>
      <small id="names"></small>
    </div>
    <span class="sync" id="sync" title=""></span>
    <div class="seg" id="langSeg">
      <button data-lang="tr">TR</button>
      <button data-lang="en">EN</button>
    </div>
    <button class="icon-btn" id="openSettings" aria-label="Settings">⚙︎</button>
  </div>
</header>

<div class="wrap">
  <div class="banner" id="banner" hidden></div>

  <nav class="tabs">
    <button data-tab="shop" data-i18n="tabShop">Alışverişler</button>
    <button data-tab="settle"><span data-i18n="tabSettle">Hesaplaşma</span><span class="badge" id="settleBadge" hidden></span></button>
    <button data-tab="rules" data-i18n="tabRules">Ev Kuralları</button>
  </nav>

  <!-- SHOP -->
  <section id="tab-shop">
    <div class="summary" style="margin-bottom:14px">
      <div class="stat"><span data-i18n="total">Toplam</span><b id="sTotal">–</b></div>
      <div class="stat hl"><span data-i18n="perPerson">Kişi başı</span><b id="sPer">–</b></div>
    </div>

    <div class="card">
      <h2 id="formTitle" data-i18n="addPurchase">Yeni alışveriş</h2>
      <form id="pForm" class="form" autocomplete="off">
        <div>
          <label class="f" for="pDesc" data-i18n="desc">Ne alındı?</label>
          <input type="text" id="pDesc" data-i18n-ph="descPh" maxlength="80">
        </div>
        <div>
          <label class="f" for="pAmt" data-i18n="amount">Tutar (₺)</label>
          <input type="text" id="pAmt" inputmode="decimal" placeholder="0,00">
        </div>
        <div class="full">
          <label class="f" data-i18n="paidBy">Kim ödedi?</label>
          <div class="payers" id="payers"></div>
        </div>
        <div class="full actions">
          <button class="btn grow" type="submit" id="pSubmit" data-i18n="add">Ekle</button>
          <button class="btn ghost" type="button" id="pCancel" data-i18n="cancel" hidden>Vazgeç</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2><span data-i18n="purchases">Bu dönemin alışverişleri</span> <span class="muted" id="pCount"></span></h2>
      <ul class="list" id="pList"></ul>
    </div>
  </section>

  <!-- SETTLE -->
  <section id="tab-settle" hidden>
    <div class="card">
      <h2 data-i18n="transfers">Kim kime ne kadar gönderecek?</h2>
      <div id="transfers"></div>
    </div>
    <div class="card">
      <h2 data-i18n="balances">Durum</h2>
      <div class="people" id="people"></div>
    </div>
    <div class="card" id="paymentsCard" hidden>
      <h2 data-i18n="sentList">Gönderilenler</h2>
      <ul class="list" id="payList"></ul>
    </div>
    <div class="card" id="historyCard" hidden>
      <h2 data-i18n="history">Geçmiş dönemler</h2>
      <ul class="list" id="histList"></ul>
    </div>
  </section>

  <!-- RULES -->
  <section id="tab-rules" hidden>
    <div class="card">
      <h2 data-i18n="tabRules">Ev Kuralları</h2>
      <ol class="rules" id="rList"></ol>
    </div>
    <div class="card">
      <h2 data-i18n="addRule">Kural ekle</h2>
      <form id="rForm" class="row" autocomplete="off">
        <input type="text" id="rText" data-i18n-ph="rulePh" maxlength="300">
        <button class="btn" type="submit" data-i18n="add">Ekle</button>
      </form>
    </div>
  </section>
</div>

<!-- SETTINGS -->
<dialog id="settings">
  <form method="dialog" id="sForm">
    <div class="dlg">
      <h2 data-i18n="settings">Ayarlar</h2>

      <label class="f" for="sMe" data-i18n="me">Ben kimim?</label>
      <select id="sMe"></select>
      <p class="hint" data-i18n="meHint"></p>

      <h3 data-i18n="ghSection">GitHub bağlantısı</h3>
      <label class="f" for="sToken" data-i18n="token">Erişim anahtarı (token)</label>
      <input type="password" id="sToken" placeholder="github_pat_…" autocomplete="off" spellcheck="false">
      <p class="hint"><span data-i18n="tokenHint"></span> <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" data-i18n="tokenHow">Token oluştur</a></p>

      <details style="margin-top:14px">
        <summary class="muted" style="cursor:pointer;font-size:14px" data-i18n="advanced">Gelişmiş</summary>
        <div class="grid2" style="margin-top:10px">
          <div><label class="f" for="sOwner" data-i18n="owner">Kullanıcı / organizasyon</label><input type="text" id="sOwner" spellcheck="false"></div>
          <div><label class="f" for="sRepo" data-i18n="repo">Repo adı</label><input type="text" id="sRepo" spellcheck="false"></div>
        </div>
        <p class="hint" id="detected"></p>
      </details>
    </div>
    <div class="dlg-foot">
      <button class="btn ghost" value="cancel" data-i18n="cancel">Vazgeç</button>
      <button class="btn" value="save" id="sSave" data-i18n="save">Kaydet</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

    syncOk:'Up to date', syncBusy:'Saving…', syncErr:'Error'
  }
};

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};
let lang = LS.get('ev.lang', 'tr');
const t = k => (I18N[lang] && I18N[lang][k]) ?? I18N.tr[k] ?? k;
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? '');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const money = c => new Intl.NumberFormat(lang === 'tr' ? 'tr-TR' : 'en-US', {style:'currency', currency:'TRY'}).format((c || 0) / 100);
const dateStr = iso => { try{ return new Date(iso).toLocaleDateString(lang === 'tr' ? 'tr-TR' : 'en-GB', {day:'numeric', month:'short'}); }catch{ return ''; } };
const avatar = (p, lg) => `<span class="av${lg ? ' lg' : ''}" style="background:${COLORS[p] || '#888'}">${esc(p[0])}</span>`;

function parseAmount(raw){
  let s = String(raw).trim().replace(/[₺\s]/g, '');
  if(!s) return NaN;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if(lc > -1 && ld > -1){
    const dec = lc > ld ? ',' : '.', th = dec === ',' ? '.' : ',';
    s = s.split(th).join('').replace(dec, '.');
  } else if(lc > -1){
    s = s.replace(/,/g, '.');
  } else if(ld > -1 && /^\d{1,3}(\.\d{3})+$/.test(s)){
    s = s.replace(/\./g, '');          // 1.250 → 1250
  }
  if(!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
  const c = Math.round(parseFloat(s) * 100);
  return c > 0 ? c : NaN;
}

function b64encode(str){
  const bytes = new TextEncoder().encode(str); let bin = '';
  for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(b64.replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

/* ============ data ============ */
function emptyData(){
  return { version:1, purchases:[], payments:[], rules:DEFAULT_RULES.map(text => ({id:uid(), text})), history:[] };
}
function normalize(d){
  d = (d && typeof d === 'object') ? d : emptyData();
  for(const k of ['purchases','payments','rules','history']) if(!Array.isArray(d[k])) d[k] = [];
  return d;
}

/* Kişi başı pay + kim kime ne gönderir (kuruş cinsinden, yuvarlama hatası yok) */
function compute(d){
  const total = d.purchases.reduce((s, p) => s + (p.amount || 0), 0);
  const n = PEOPLE.length, base = Math.floor(total / n), rem = total - base * n;
  const paid = {}, bal = {};
  PEOPLE.forEach(p => paid[p] = 0);
  d.purchases.forEach(p => { if(p.payer in paid) paid[p.payer] += p.amount; });
  PEOPLE.forEach((p, i) => bal[p] = paid[p] - (base + (i < rem ? 1 : 0)));
  d.payments.forEach(x => { if(x.from in bal && x.to in bal){ bal[x.from] += x.amount; bal[x.to] -= x.amount; } });

  const cred = PEOPLE.filter(p => bal[p] > 0).map(p => ({p, v:bal[p]})).sort((a, b) => b.v - a.v);
  const debt = PEOPLE.filter(p => bal[p] < 0).map(p => ({p, v:-bal[p]})).sort((a, b) => b.v - a.v);
  const transfers = [];
  let i = 0, j = 0;
  while(i < debt.length && j < cred.length){
    const a = Math.min(debt[i].v, cred[j].v);
    if(a > 0) transfers.push({from:debt[i].p, to:cred[j].p, amount:a});
    debt[i].v -= a; cred[j].v -= a;
    if(debt[i].v === 0) i++;
    if(cred[j].v === 0) j++;
  }
  return { total, per: Math.round(total / n), paid, bal, transfers };
}

function archive(d){
  const c = compute(d);
  d.history.unshift({ id:uid(), closedAt:new Date().toISOString(), total:c.total, per:c.per, count:d.purchases.length });
  d.history = d.history.slice(0, 24);
  d.purchases = []; d.payments = [];
}

/* ============ storage: GitHub or local preview ============ */
function detectRepo(){
  const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
  if(!m) return null;
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return { owner:m[1], repo: (seg && !seg.includes('.')) ? seg : location.hostname.toLowerCase() };
}
function getRepo(){
  const o = LS.get('ev.owner', '') || CONFIG.owner, r = LS.get('ev.repo', '') || CONFIG.repo;
  return (o && r) ? {owner:o, repo:r} : detectRepo();
}
const token = () => LS.get('ev.token', '');
const errCode = (code, extra) => Object.assign(new Error(code), {code, extra});

const github = {
  base(){ const {owner, repo} = getRepo(); return `https://api.github.com/repos/${owner}/${repo}`; },
  headers(json){
    const h = {'Accept':'application/vnd.github+json'};
    if(token()) h.Authorization = 'Bearer ' + token();
    if(json) h['Content-Type'] = 'application/json';
    return h;
  },
  async req(url, opt = {}){
    let r;
    try{ r = await fetch(url, {cache:'no-store', ...opt}); }
    catch{ throw errCode('net'); }
    return r;
  },
  fail(r){
    if(r.status === 401) return errCode('auth');
    if(r.status === 403 || r.status === 429) return errCode(r.headers.get('x-ratelimit-remaining') === '0' ? 'rate' : 'auth');
    if(r.status === 404) return errCode('notfound');
    return errCode('other', r.status);
  },
  async load(){
    const r = await this.req(`${this.base()}/contents/${CONFIG.path}?ref=${CONFIG.dataBranch}`, {headers:this.headers()});
    if(r.status === 404){
      const repoCheck = await this.req(this.base(), {headers:this.headers()});
      if(repoCheck.status === 404) throw errCode('notfound');
      return {data:emptyData(), sha:null};
    }
    if(!r.ok) throw this.fail(r);
    const j = await r.json();
    return {data:normalize(JSON.parse(b64decode(j.content))), sha:j.sha};
  },
  async ensureBranch(){
    const b = this.base();
    const r = await this.req(`${b}/git/ref/heads/${CONFIG.dataBranch}`, {headers:this.headers()});
    if(r.ok) return;
    if(r.status !== 404) throw this.fail(r);
    const info = await this.req(b, {headers:this.headers()});
    if(!info.ok) throw this.fail(info);
    const def = (await info.json()).default_branch;
    const ref = await this.req(`${b}/git/ref/heads/${def}`, {headers:this.headers()});
    if(!ref.ok) throw this.fail(ref);
    const sha = (await ref.json()).object.sha;
    const c = await this.req(`${b}/git/refs`, {method:'POST', headers:this.headers(true), body:JSON.stringify({ref:'refs/heads/' + CONFIG.dataBranch, sha})});
    if(!c.ok && c.status !== 422) throw this.fail(c);
  },
  async save(data, sha, label){
    if(!token()) throw errCode('notoken');
    if(!sha) await this.ensureBranch();
    const me = LS.get('ev.me', '');
    const body = {
      message: `${label}${me ? ' (' + me + ')' : ''}`,
      content: b64encode(JSON.stringify(data, null, 2) + '\n'),
      branch: CONFIG.dataBranch
    };
    if(sha) body.sha = sha;
    const r = await this.req(`${this.base()}/contents/${CONFIG.path}`, {method:'PUT', headers:this.headers(true), body:JSON.stringify(body)});
    if(r.status === 409 || r.status === 422) throw errCode('conflict');
    if(!r.ok) throw this.fail(r);
    return (await r.json()).content.sha;
  }
};
const local = {
  async load(){ return {data:normalize(LS.get('ev.localData', null) || emptyData()), sha:'local'}; },
  async save(d){ LS.set('ev.localData', d); return 'local'; }
};
const store = () => getRepo() ? github : local;

/* ============ state + sync ============ */
let DATA = null, busy = false, editingId = null, payer = '';

function setSync(s){
  const el = $('#sync');
  el.className = 'sync' + (s === 'ok' ? '' : ' ' + s);
  el.title = t(s === 'busy' ? 'syncBusy' : s === 'err' ? 'syncErr' : 'syncOk');
}
function toast(msg, isErr){
  const el = $('#toast');
  el.textContent = msg; el.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.className = 'toast', isErr ? 4200 : 2200);
}
function showErr(e){
  const map = {notoken:'errNoToken', auth:'errAuth', notfound:'errNotFound', rate:'errRate', net:'errNet', conflict:'errConflict', gone:'errGone'};
  toast(map[e.code] ? t(map[e.code]) : fill(t('errOther'), {x:e.extra || e.message}), true);
  if(e.code === 'notoken' || e.code === 'auth') openSettings();
}

async function refresh(){
  if(busy) return;
  try{
    setSync('busy');
    const {data} = await store().load();
    if(!busy){ DATA = data; render(); }
    setSync('ok');
  }catch(e){ setSync('err'); if(!DATA){ DATA = emptyData(); render(); } showErr(e); }
}

/* Her değişiklik: en güncel veriyi çek → uygula → kaydet. Çakışma olursa tekrar dene. */
async function mutate(label, fn){
  if(store() === github && !token()){ showErr(errCode('notoken')); return false; }
  if(busy) return false;
  busy = true; setSync('busy');
  try{
    for(let attempt = 0; attempt < 4; attempt++){
      const {data, sha} = await store().load();
      const result = fn(data);
      try{
        await store().save(data, sha, label);
        DATA = data; render(); setSync('ok');
        return result === undefined ? true : result;
      }catch(e){
        if(e.code === 'conflict' && attempt < 3){ await sleep(300 + Math.random() * 700); continue; }
        throw e;
      }
    }
  }catch(e){
    setSync('err'); showErr(e); return false;
  }finally{ busy = false; }
}

/* ============ rendering ============ */
function renderStatic(){
  document.documentElement.lang = lang;
  document.title = t('appTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('#langSeg button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  $('#names').textContent = PEOPLE.join(' · ');
  $('#formTitle').textContent = t(editingId ? 'editPurchase' : 'addPurchase');
  $('#pSubmit').textContent = t(editingId ? 'update' : 'add');
  renderPayers();
}
function renderPayers(){
  $('#payers').innerHTML = PEOPLE.map(p =>
    `<button type="button" data-p="${esc(p)}" class="${payer === p ? 'on' : ''}">${avatar(p)}${esc(p)}</button>`).join('');
}
function renderBanner(){
  const b = $('#banner');
  if(store() === local){ b.hidden = false; b.textContent = t('localMode'); }
  else if(!token()){ b.hidden = false; b.innerHTML = `${esc(t('readOnly'))} <button type="button" id="bannerBtn">${esc(t('readOnlyBtn'))}</button>.`; }
  else b.hidden = true;
}

function render(){
  if(!DATA) return;
  renderBanner();
  const c = compute(DATA), me = LS.get('ev.me', '');

  // summary
  $('#sTotal').textContent = money(c.total);
  $('#sPer').textContent = money(c.per);
  $('#pCount').textContent = DATA.purchases.length ? `(${DATA.purchases.length})` : '';

  // purchases
  const items = [...DATA.purchases].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  $('#pList').innerHTML = items.length ? items.map(p => `
    <li>
      ${avatar(p.payer)}
      <div class="li-main"><b>${esc(p.desc)}</b><small>${esc(p.payer)} · ${dateStr(p.date)}</small></div>
      <span class="amt">${money(p.amount)}</span>
      <button class="mini" data-edit="${p.id}" title="${esc(t('edit'))}">✎</button>
      <button class="mini" data-del="${p.id}" title="${esc(t('del'))}">✕</button>
    </li>`).join('') : `<div class="empty">${esc(t('noPurchases'))}</div>`;

  // transfers
  const badge = $('#settleBadge');
  badge.hidden = !c.transfers.length; badge.textContent = c.transfers.length;
  let tr = '';
  if(c.transfers.length){
    tr = c.transfers.map(x => `
      <div class="tr${me && (x.from === me || x.to === me) ? ' me' : ''}">
        <div class="who">${avatar(x.from)}${esc(x.from)}${x.from === me ? ` <small class="muted">(${esc(t('you'))})</small>` : ''}
          <span class="arrow">→</span>${avatar(x.to)}${esc(x.to)}${x.to === me ? ` <small class="muted">(${esc(t('you'))})</small>` : ''}</div>
        <span class="amt">${money(x.amount)}</span>
        <button class="btn ok sm" data-sent="${esc(x.from)}|${esc(x.to)}|${x.amount}">✓ ${esc(t('sent'))}</button>
      </div>`).join('');
  } else if(DATA.purchases.length){
    tr = `<div class="done">${esc(t('allSettled'))}</div>
          <button class="btn ghost" style="width:100%" id="closeBtn">${esc(t('closePeriod'))}</button>`;
  } else {
    tr = `<div class="empty">${esc(t('nothingYet'))}</div>`;
  }
  $('#transfers').innerHTML = tr;

  // balances
  $('#people').innerHTML = PEOPLE.map(p => {
    const b = c.bal[p];
    const pill = b > 0 ? `<span class="pill pos">${esc(fill(t('getsBack'), {x:money(b)}))}</span>`
              : b < 0 ? `<span class="pill neg">${esc(fill(t('owes'), {x:money(-b)}))}</span>`
              : `<span class="pill zero">${esc(t('even'))}</span>`;
    return `<div class="person">${avatar(p, true)}<div><div class="nm">${esc(p)}</div>
      <small>${esc(fill(t('paid'), {x:money(c.paid[p])}))}</small>${pill}</div></div>`;
  }).join('');

  // payments this period
  $('#paymentsCard').hidden = !DATA.payments.length;
  $('#payList').innerHTML = [...DATA.payments].reverse().map(x => `
    <li>${avatar(x.from)}<div class="li-main"><b>${esc(x.from)} → ${esc(x.to)}</b><small>${dateStr(x.date)}</small></div>
      <span class="amt">${money(x.amount)}</span>
      <button class="mini" data-undo="${x.id}" title="${esc(t('undo'))}">↶</button></li>`).join('');

  // history
  $('#historyCard').hidden = !DATA.history.length;
  $('#histList').innerHTML = DATA.history.map(h => `
    <li><div class="li-main"><b>${dateStr(h.closedAt)}</b>
      <small>${esc(fill(t('historyRow'), {n:h.count, total:money(h.total), pp:money(h.per)}))}</small></div></li>`).join('');

  // rules
  $('#rList').innerHTML = DATA.rules.length ? DATA.rules.map(r => `
    <li><span class="txt">${esc(r.text)}</span>
      <button class="mini" data-redit="${r.id}" title="${esc(t('edit'))}">✎</button>
      <button class="mini" data-rdel="${r.id}" title="${esc(t('del'))}">✕</button></li>`).join('')
    : `<div class="empty">${esc(t('noRules'))}</div>`;
}

/* ============ tabs / language ============ */
function setTab(name){
  ['shop','settle','rules'].forEach(n => $('#tab-' + n).hidden = n !== name);
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  LS.set('ev.tab', name);
}
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
document.querySelectorAll('#langSeg button').forEach(b => b.onclick = () => {
  lang = b.dataset.lang; LS.set('ev.lang', lang); renderStatic(); render();
});

/* ============ purchases ============ */
$('#payers').addEventListener('click', e => {
  const b = e.target.closest('button[data-p]'); if(!b) return;
  payer = b.dataset.p; renderPayers();
});
function resetForm(){
  editingId = null;
  $('#pDesc').value = ''; $('#pAmt').value = '';
  payer = LS.get('ev.me', '') || '';
  $('#pCancel').hidden = true;
  renderStatic();
}
$('#pCancel').onclick = resetForm;
$('#pForm').onsubmit = async e => {
  e.preventDefault();
  const desc = $('#pDesc').value.trim(), amount = parseAmount($('#pAmt').value);
  if(!desc) return toast(t('errDesc'), true);
  if(!amount) return toast(t('errAmount'), true);
  if(!payer) return toast(t('errPayer'), true);
  const id = editingId;
  $('#pSubmit').disabled = true;
  const ok = await mutate(id ? `Düzenlendi: ${desc}` : `Eklendi: ${desc} ${(amount / 100).toFixed(2)} TL`, d => {
    if(id){
      const p = d.purchases.find(x => x.id === id);
      if(p){ p.desc = desc; p.amount = amount; p.payer = payer; return; }
    }
    d.purchases.push({id:uid(), desc, amount, payer, date:new Date().toISOString()});
  });
  $('#pSubmit').disabled = false;
  if(ok){ toast(t(id ? 'saved' : 'added')); resetForm(); }
};
$('#pList').addEventListener('click', async e => {
  const ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
  if(ed){
    const p = DATA.purchases.find(x => x.id === ed.dataset.edit); if(!p) return;
    editingId = p.id; payer = p.payer;
    $('#pDesc').value = p.desc;
    $('#pAmt').value = (p.amount / 100).toFixed(2).replace('.', lang === 'tr' ? ',' : '.');
    $('#pCancel').hidden = false; renderStatic();
    $('#pForm').scrollIntoView({behavior:'smooth', block:'center'});
  }
  if(del){
    const p = DATA.purchases.find(x => x.id === del.dataset.del); if(!p) return;
    if(!confirm(fill(t('confirmDelete'), {x:p.desc}))) return;
    if(await mutate(`Silindi: ${p.desc}`, d => { d.purchases = d.purchases.filter(x => x.id !== p.id); })) toast(t('deleted'));
  }
});

/* ============ settle ============ */
$('#transfers').addEventListener('click', async e => {
  if(e.target.closest('#closeBtn')){
    if(!confirm(t('confirmClose'))) return;
    if(await mutate('Dönem kapatıldı', d => archive(d))) toast(t('periodClosed'));
    return;
  }
  const b = e.target.closest('[data-sent]'); if(!b) return;
  const [from, to, amt] = b.dataset.sent.split('|');
  if(!confirm(fill(t('confirmSent'), {from, to, amt:money(+amt)}))) return;
  let closed = false;
  const ok = await mutate(`Gönderildi: ${from} → ${to} ${(amt / 100).toFixed(2)} TL`, d => {
    const cur = compute(d).transfers.find(x => x.from === from && x.to === to);
    if(!cur) throw errCode('gone');
    d.payments.push({id:uid(), from, to, amount:cur.amount, date:new Date().toISOString()});
    const after = compute(d);
    if(PEOPLE.every(p => after.bal[p] === 0)){ archive(d); closed = true; }
  });
  if(ok) toast(closed ? t('periodClosed') : '✓ ' + t('sent'));
});
$('#payList').addEventListener('click', async e => {
  const b = e.target.closest('[data-undo]'); if(!b) return;
  if(!confirm(t('confirmUndo'))) return;
  await mutate('Gönderim geri alındı', d => { d.payments = d.payments.filter(x => x.id !== b.dataset.undo); });
});

/* ============ rules ============ */
$('#rForm').onsubmit = async e => {
  e.preventDefault();
  const text = $('#rText').value.trim(); if(!text) return;
  if(await mutate('Kural eklendi', d => { d.rules.push({id:uid(), text}); })){ $('#rText').value = ''; toast(t('added')); }
};
$('#rList').addEventListener('click', async e => {
  const ed = e.target.closest('[data-redit]'), del = e.target.closest('[data-rdel]');
  if(ed){
    const r = DATA.rules.find(x => x.id === ed.dataset.redit); if(!r) return;
    const nt = prompt(t('editRulePrompt'), r.text);
    if(nt === null || !nt.trim() || nt.trim() === r.text) return;
    if(await mutate('Kural düzenlendi', d => { const x = d.rules.find(y => y.id === r.id); if(x) x.text = nt.trim(); })) toast(t('saved'));
  }
  if(del){
    if(!confirm(t('confirmDeleteRule'))) return;
    if(await mutate('Kural silindi', d => { d.rules = d.rules.filter(x => x.id !== del.dataset.rdel); })) toast(t('deleted'));
  }
});

/* ============ settings ============ */
function openSettings(){
  const me = LS.get('ev.me', '');
  $('#sMe').innerHTML = `<option value="">${esc(t('meNone'))}</option>` + PEOPLE.map(p => `<option ${p === me ? 'selected' : ''}>${esc(p)}</option>`).join('');
  $('#sToken').value = token();
  $('#sOwner').value = LS.get('ev.owner', '');
  $('#sRepo').value = LS.get('ev.repo', '');
  const det = detectRepo();
  $('#detected').textContent = det ? fill(t('detected'), {x:`${det.owner}/${det.repo}`}) : t('notDetected');
  if(!$('#settings').open) $('#settings').showModal();
}
$('#openSettings').onclick = openSettings;
document.addEventListener('click', e => { if(e.target.id === 'bannerBtn') openSettings(); });
$('#settings').addEventListener('close', () => {
  if($('#settings').returnValue !== 'save') return;
  const me = $('#sMe').value, tk = $('#sToken').value.trim(), o = $('#sOwner').value.trim(), r = $('#sRepo').value.trim();
  me ? LS.set('ev.me', me) : LS.del('ev.me');
  tk ? LS.set('ev.token', tk) : LS.del('ev.token');
  o ? LS.set('ev.owner', o) : LS.del('ev.owner');
  r ? LS.set('ev.repo', r) : LS.del('ev.repo');
  if(!editingId){ payer = me || payer; renderPayers(); }
  toast(t('saved'));
  refresh();
});

/* ============ start ============ */
payer = LS.get('ev.me', '') || '';
renderStatic();
setTab(LS.get('ev.tab', 'shop'));
refresh();
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') refresh(); });
setInterval(() => {
  if(document.visibilityState === 'visible' && token() && !editingId && !$('#settings').open) refresh();
}, 45000);
</script>
